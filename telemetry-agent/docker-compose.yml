version: '3.8'

networks:
  finops_net:
    driver: bridge

services:
  agent:
    build: .
    ports:
      - "50051:50051"
    networks:
      - finops_net
    # GPU Passthrough (Will degrade gracefully to mock if unavailable)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
