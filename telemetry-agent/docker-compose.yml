networks:
  finops_net:
    driver: bridge

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
    networks:
      - finops_net

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    networks:
      - finops_net

  engine:
    build: ./accountant
    depends_on:
      - nats
      - timescaledb
    networks:
      - finops_net

  agent:
    build: .
    networks:
      - finops_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
