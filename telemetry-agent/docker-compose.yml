version: '3.8'

networks:
  finops_net:
    driver: bridge

services:
  agent:
    build: .
    ports:
      - "8080:8080"
    networks:
      - finops_net
    # GPU Passthrough (Will degrade gracefully to mock if unavailable)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - finops_net
